<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CertStudy - ISTQB CTFL practice</title>
<meta name="description" content="Practise the ISTQB Certified Tester Foundation Level sample exam questions online: instant explanations, timed 40-question mock exams, bookmarks and progress tracking.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#07100D">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/home" aria-label="CertStudy home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.4"></circle>
        <circle cx="21.5" cy="10.5" r="2.4" fill="var(--gold)"></circle>
      </svg>
      <span class="brand-txt">
        <strong>CertStudy</strong>
        <small>ISTQB exam trainer</small>
      </span>
    </a>
    <div class="bar-right">
      <span class="chip" id="certChip">CTFL v4.0</span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
      </button>
    </div>
  </div>
</header>

<main id="view" tabindex="-1">
  <p class="loading">Loading study data…</p>
</main>

<nav class="dock" aria-label="Main navigation">
  <a href="#/home" data-nav="home">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11l8-7 8 7v9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
    <span>Home</span>
  </a>
  <a href="#/exams" data-nav="exams">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
    <span>Exams</span>
  </a>
  <a href="#/practice" data-nav="practice">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12l4 4L19 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <span>Practice</span>
  </a>
  <a href="#/review" data-nav="review">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4h10v16l-5-4-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
    <span>Review</span>
  </a>
  <a href="#/stats" data-nav="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 19V9M12 19V5M19 19v-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"></path></svg>
    <span>Stats</span>
  </a>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="assets/js/app.js" defer></script>
</body>
</html>
